name: Preview site

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    name: Pull request preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        if: github.event.action != 'closed'
        run: ./scripts/install-hugo.sh

      - name: Build
        if: github.event.action != 'closed'
        env:
          HUGO_BUILDDRAFTS: "true"
          HUGO_ENV: preview
        run: ./scripts/build.sh "https://blog.miladibra.com/pr-preview/pr-${{ github.event.number }}/"

      - name: Publish preview
        if: github.event.action != 'closed'
        env:
          COMMIT_MESSAGE: "deploy: preview for pull request #${{ github.event.number }}"
        run: ./scripts/publish-gh-pages.sh dir public "pr-preview/pr-${{ github.event.number }}"

      - name: Remove preview
        if: github.event.action == 'closed'
        env:
          COMMIT_MESSAGE: "deploy: remove preview for pull request #${{ github.event.number }}"
        run: ./scripts/publish-gh-pages.sh remove "pr-preview/pr-${{ github.event.number }}"

      - name: Record the preview link
        if: github.event.action != 'closed'
        run: |
          {
            echo "### Preview"
            echo ""
            echo "https://blog.miladibra.com/pr-preview/pr-${{ github.event.number }}/"
            echo ""
            echo "RSS for this preview: https://blog.miladibra.com/pr-preview/pr-${{ github.event.number }}/index.xml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment with the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- hugo-pr-preview -->";
            const number = context.payload.pull_request.number;
            const url = `https://blog.miladibra.com/pr-preview/pr-${number}/`;
            const closed = context.payload.action === "closed";
            const body = closed
              ? `${marker}\nPreview for this pull request has been removed.`
              : [
                  marker,
                  "### Preview",
                  "",
                  url,
                  "",
                  `RSS for this preview: ${url}index.xml`,
                  "",
                  "Drafts are included in the preview. The dev.to feed stays on the production site: https://blog.miladibra.com/index.xml",
                ].join("\n");

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.data.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
